name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -m "not native"
      - run: python -m build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
